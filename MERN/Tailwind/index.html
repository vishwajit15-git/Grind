<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS Demo</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="border-2 border-black rounded-md h-72 w-[700px] m-10">
    
    <div class="h-20 w-full bg-blue-500 rounded-t-md flex justify-center items-center">
        <h1 class="text-white text-2xl">News you can Trust.</h1>
    </div>

    <div class="flex flex-col items-center text-center px-6">
        <h2 class="font-bold mt-2 text-lg">
            Stay up to date with latest!
        </h2>

        <h3 class="text-gray-600">
            Subscribe to our newsletter for news straight into your inbox
        </h3>

        <div class="w-64 bg-gray-200 h-10 flex items-center justify-center m-2 rounded">
            <span class="text-gray-500">you@example.com</span>
        </div>
        <div class="w-64 bg-blue-900 h-10 flex items-center justify-center  rounded-full">
            <span class="text-white">Subscribe now</span>
        </div>
        <div class="m-2">
            <span>We value your  privacy</span>
        </div>
    </div>
</div>
</body>
</html>
